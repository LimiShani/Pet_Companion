name: pet_companion
description: "Pet Companion: a warm, friendly hub for pet owners. Pet profiles, feeding, activity, health log, reminders, community and store."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  cached_network_image: ^3.4.1
  crop_your_image: ^2.0.1
  file_picker: ^11.0.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.2.3
  google_fonts: ^8.1.0
  image: ^4.10.1
  image_picker: ^1.2.2
  # flutter_localizations pins intl to one exact version (0.20.2 on Flutter 3.35).
  intl: ^0.20.2
  pdf: ^3.12.0
  share_plus: ^12.0.2
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.17.2
  url_launcher: ^6.3.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # A fake network for the Supabase repositories' tests; Supabase brings it in already.
  http: ^1.6.0

flutter:
  uses-material-design: true
  # Needed by `flutter gen-l10n`. The strings classes are generated by
  # `dart run tool/gen_l10n.dart` (one class per feature), not by a root
  # l10n.yaml: do not add one.
  generate: true
  assets:
    - assets/images/
    # The fonts' licence texts travel with the app.
    - assets/fonts/OFL-Nunito.txt
    - assets/fonts/OFL-Fredoka.txt
  # Bundled fonts (SIL Open Font License): Nunito for Latin letters and
  # digits, Fredoka for Hebrew letters. See lib/theme/app_fonts.dart.
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Regular.ttf
          weight: 400
        - asset: assets/fonts/Fredoka-Medium.ttf
          weight: 500
        - asset: assets/fonts/Fredoka-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fredoka-Bold.ttf
          weight: 700
