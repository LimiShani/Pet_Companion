name: pet_companion
description: "Pet Companion: a warm, friendly hub for pet owners. Pet profiles, feeding, activity, health log, reminders, community and store."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  cached_network_image: ^3.4.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.2.3
  google_fonts: ^8.1.0
  image_picker: ^1.2.2
  intl: ^0.20.3
  supabase_flutter: ^2.17.2
  url_launcher: ^6.3.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
